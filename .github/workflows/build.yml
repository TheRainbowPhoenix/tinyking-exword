name: TKING EX-word

# Builds every committed branch, not only main. The packages are attached to
# each workflow run in GitHub Actions; tags do not require a separate release.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: tking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-check:
    name: Physics, pack reader and crown metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify reproducible 32x32 crown art
        run: python3 tools/generate_icon.py --check
      - name: Require checked-in game data
        run: test -s tower.pak
      - name: Check LCD dirty region calculations
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/dirty.c tests/test_dirty.c -o /tmp/test-dirty
          /tmp/test-dirty
      - name: Verify fixed camera transitions and page hysteresis
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/camera.c tests/test_camera.c -o /tmp/test-camera
          /tmp/test-camera
      - name: Verify batched GMPK streaming and old-firmware fallback
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/stub -Isrc src/pak.c tests/test_pak_io.c \
            -Wl,--wrap=read -Wl,--wrap=lseek -o /tmp/test-pak-io
          /tmp/test-pak-io tower.pak
      - name: Compare C physics, streaming and weather against Python
        run: python3 tests/test_port.py

  build:
    name: Build TKING packages (JA + CN)
    needs: host-check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/Edelweiss
          ref: 2006f6bb3b8dcfe2d51b9d6d7ec17186f0e539df
          path: dependencies/edelweiss
      - uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/exword-xd-a8500-TEST
          path: dependencies/metadata
      # Use the committed game pack; never silently build asset-free packages.
      - name: Check checked-in tower.pak
        shell: bash
        run: |
          set -euo pipefail
          test -s tower.pak
          echo "Bundling $(wc -c < tower.pak) bytes of game data"
          test "$(git -C dependencies/edelweiss rev-parse HEAD)" = "2006f6bb3b8dcfe2d51b9d6d7ec17186f0e539df"
      - name: Install EX-word fxSDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword \
            https://github.com/TheRainbowPhoenix/fxsdk-exword.git /tmp/fxsdk-src
          cmake -S /tmp/fxsdk-src -B /tmp/fxsdk-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/fxsdk-exword \
            -DFXLINK_DISABLE_SDL2=ON -DFXLINK_DISABLE_UDISKS2=ON
          cmake --build /tmp/fxsdk-build --parallel 2
          cmake --install /tmp/fxsdk-build
          git clone --depth=1 https://github.com/brijohn/elf2d01.git /tmp/elf2d01
          cc -O2 /tmp/elf2d01/elf2d01.c -o /tmp/fxsdk-exword/bin/elf2d01
          echo /tmp/fxsdk-exword/bin >> "$GITHUB_PATH"
      - name: Install EX-word gint runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword \
            https://github.com/TheRainbowPhoenix/gint-exword.git /tmp/gint-src
          cmake -S /tmp/gint-src -B /tmp/gint-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/gint-exword \
            -DCMAKE_MODULE_PATH=/tmp/fxsdk-exword/lib/cmake/fxsdk
          cmake --build /tmp/gint-build --parallel 2
          cmake --install /tmp/gint-build
      - name: Configure and build TKING against Edelweiss
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_PREFIX_PATH=/tmp/gint-exword \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk' \
            -DEXWORD_APP_ID=TKING \
            -DEXWORD_APP_TITLE=TKING \
            -DFETCHCONTENT_SOURCE_DIR_EDELWEISS="$GITHUB_WORKSPACE/dependencies/edelweiss" \
            -DEXWORD_METADATA_SOURCE="$GITHUB_WORKSPACE/dependencies/metadata"
          cmake --build build --parallel 2
          # The upstream test requires >128 KiB of *embedded* data because it
          # targets a large-demo payload. TKING streams tower.pak instead.
          # Keep the loader/relocation checks, without that demo-only threshold.
          cc -std=c11 -Wall -Wextra -Werror \
            -Idependencies/edelweiss/exword -Idependencies/edelweiss/sdk \
            dependencies/edelweiss/exword/elf.c tests/check_tking_edl.c \
            -o /tmp/check-tking-edl
          /tmp/check-tking-edl build/main.edl
          python3 tools/check_package.py build
      - name: Confirm both locale packages include the committed game data
        shell: bash
        run: |
          set -euo pipefail
          for locale in ja cn; do
            cmp -- tower.pak "build/packages/$locale/TKING/tower.pak"
            echo "TKING-$locale includes the exact committed tower.pak"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TKING-ja
          path: build/packages/ja/TKING/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: TKING-cn
          path: build/packages/cn/TKING/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TKING-debug
          path: |
            build/*.edl
            build/*.d01
            build/*.map
            build/edelweiss-version.txt
          if-no-files-found: warn
          retention-days: 14
